# ==============================================================================
# Autoscript VL - High Performance VLESS WebSocket Gateway
# Frontend Multiplexer for VLESS WS (HTTP & TLS)
# Target OS: Ubuntu 24.04 & Debian 13 (Systemd, Glibc)
# ==============================================================================

global
    log /dev/log local0 warning
    log /dev/log local1 notice
    maxconn 100000
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  30m
    timeout server  30m

# ==============================================================================
# FRONTEND: Plain HTTP (Port 80 & Cloudflare HTTP Ports)
# ==============================================================================
frontend http_in
    bind *:80,*:8880,*:2082
    mode tcp
    tcp-request inspect-delay 500ms
    acl is_acme     req.payload(0,128) -m sub /.well-known/acme-challenge/
    tcp-request content accept if { req.len gt 0 }

    use_backend b_acme        if is_acme
    default_backend b_xray_ws

# ==============================================================================
# FRONTEND: Port 443 Multiplexer (Outer Raw TCP Filter)
# ==============================================================================
frontend port_443_in
    bind *:443,*:8443,*:2053,*:2083,*:2087,*:2096
    mode tcp
    default_backend b_tls_loop

backend b_tls_loop
    mode tcp
    server s_tls_loop 127.0.0.1:10443 send-proxy

# ==============================================================================
# FRONTEND: TLS Termination & Decrypted Dispatcher
# ==============================================================================
frontend tls_in
    bind 127.0.0.1:10443 accept-proxy ssl crt /etc/vl/vl.pem alpn h2,http/1.1
    mode tcp
    tcp-request inspect-delay 500ms
    acl is_acme     req.payload(0,128) -m sub /.well-known/acme-challenge/
    tcp-request content accept if { req.len gt 0 }

    use_backend b_acme        if is_acme
    default_backend b_xray_ws

# ==============================================================================
# BACKENDS
# ==============================================================================

# Xray VLESS WebSocket Inbound
backend b_xray_ws
    mode tcp
    server s_xray_ws 127.0.0.1:10001 send-proxy-v2

# ACME Standalone Challenge Backend
backend b_acme
    mode tcp
    server s_acme 127.0.0.1:18080
